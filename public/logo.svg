<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="peachGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="50%" stop-color="#DD6E42" />
      <stop offset="100%" stop-color="#C2542B" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A262F" />
      <stop offset="100%" stop-color="#10171C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="120" height="120" rx="28" fill="url(#bgGradient)" stroke="#DD6E42" stroke-opacity="0.3" stroke-width="2" />

  <!-- Monogram Geometry 'A' and 'B' -->
  <g transform="translate(18, 16)">
    <!-- 'A' Left Pillar & Apex -->
    <path
      d="M14 74 L38 18 C40 13 44 13 46 18 L70 74"
      stroke="url(#peachGradient)"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- 'A' Horizontal Bridge connecting to 'B' -->
    <path
      d="M26 50 L64 50"
      stroke="url(#peachGradient)"
      stroke-width="6"
      stroke-linecap="round"
    />
    <!-- 'B' Upper Loop -->
    <path
      d="M44 26 C62 26 74 33 74 44 C74 52 64 54 50 54"
      stroke="url(#peachGradient)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    />
    <!-- 'B' Lower Loop -->
    <path
      d="M46 54 C66 54 78 61 78 74 C78 86 64 88 40 88 L34 88"
      stroke="url(#peachGradient)"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    />
    <!-- Neural / AI Center Node -->
    <circle cx="42" cy="18" r="4" fill="#FFB703" filter="url(#glow)" />
    <circle cx="64" cy="50" r="3.5" fill="#DD6E42" />
  </g>
</svg>
