<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10171C" />
      <stop offset="100%" stopColor="#17222A" />
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFB703" />
      <stop offset="100%" stopColor="#DD6E42" />
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4F6D7A" />
      <stop offset="100%" stopColor="#2A3B44" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#364E5C" stroke-width="1.5" />
  
  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="560" />
    <line x1="200" y1="0" x2="200" y2="560" />
    <line x1="400" y1="0" x2="400" y2="560" />
    <line x1="600" y1="0" x2="600" y2="560" />
    <line x1="800" y1="0" x2="800" y2="560" />
    <line x1="950" y1="0" x2="950" y2="560" />
    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    <line x1="0" y1="460" x2="1000" y2="460" />
  </g>

  <!-- Header / Badge -->
