  <g transform="translate(800, 160)">
    <rect width="160" height="220" rx="12" fill="#1A262F" stroke="#364E5C" stroke-width="1.5" />
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#243540" />
    <!-- Check & Bell icon -->
    <path d="M26 36 L32 42 L42 26" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="16" y="82" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Executed Actions</text>
    <text x="16" y="104" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">DELIVERABLES</text>
    <text x="16" y="130" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Google Calendar Sync</text>
    <text x="16" y="152" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Audio Voice Briefing</text>
    <text x="16" y="174" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Automated Notifications</text>
    <rect x="16" y="190" width="128" height="18" rx="4" fill="#273742" />
    <text x="24" y="203" fill="#E8DAB2" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Zero Cognitive Load</text>
  </g>

  <!-- Bottom Architecture Metrics Footer -->
  <g transform="translate(40, 440)">
    <rect width="920" height="75" rx="10" fill="#141E25" stroke="#243540" stroke-width="1" />
    <g transform="translate(30, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">ORCHESTRATION PATTERN</text>
      <text x="0" y="38" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Multi-Agent State Router</text>
    </g>
    <line x1="250" y1="15" x2="250" y2="60" stroke="#243540" stroke-width="1" />
    <g transform="translate(280, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">INTEGRATION PROTOCOL</text>
      <text x="0" y="38" fill="#FFB703" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">FastMCP (Anthropic Standard)</text>
    </g>
    <line x1="520" y1="15" x2="520" y2="60" stroke="#243540" stroke-width="1" />
    <g transform="translate(550, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">CONTEXT RETENTION</text>
      <text x="0" y="38" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Dynamic Multi-Session Memory</text>
    </g>
    <line x1="750" y1="15" x2="750" y2="60" stroke="#243540" stroke-width="1" />
    <g transform="translate(775, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">SOURCE</text>
      <text x="0" y="38" fill="#DD6E42" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">GitHub (Public MIT)</text>
    </g>
  </g>
</svg>

