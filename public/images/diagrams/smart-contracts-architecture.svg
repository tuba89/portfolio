<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10171C" />
      <stop offset="100%" stopColor="#17222A" />
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFB703" />
      <stop offset="100%" stopColor="#DD6E42" />
    </linearGradient>
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#627EEA" />
      <stop offset="100%" stopColor="#3B5998" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" stroke="#364E5C" stroke-width="1.5" />
  
  <!-- Subtle technical grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="560" />
    <line x1="300" y1="0" x2="300" y2="560" />
    <line x1="500" y1="0" x2="500" y2="560" />
    <line x1="700" y1="0" x2="700" y2="560" />
    <line x1="900" y1="0" x2="900" y2="560" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    <line x1="0" y1="440" x2="1000" y2="440" />
  </g>

  <!-- Header / Badge -->
  <rect x="40" y="32" width="240" height="28" rx="14" fill="#273742" stroke="#DD6E42" stroke-width="1" />
  <circle cx="56" cy="46" r="4" fill="#627EEA" />
  <text x="70" y="50" fill="#E8DAB2" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.05em">EVM SMART CONTRACTS &amp; WEB3</text>
  <text x="40" y="90" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Decentralized Escrow &amp; Multi-Chain Settlement Flow</text>
  <text x="40" y="112" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="12">Solidity Protocols · Gas Optimized · Programmable Milestone Release · Event Reconciliation</text>

  <!-- Node 1: Client dApp Layer (Left) -->
  <g transform="translate(40, 150)">
    <rect width="200" height="240" rx="12" fill="#1A262F" stroke="#364E5C" stroke-width="1.5" />
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#243540" />
    <!-- Wallet / Key icon -->
    <rect x="24" y="27" width="24" height="18" rx="3" stroke="#FFB703" stroke-width="2" fill="none" />
    <circle cx="38" cy="36" r="2.5" fill="#FFB703" />
    
    <text x="16" y="80" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Frontend dApp &amp; Wallet</text>
    <text x="16" y="100" fill="#DD6E42" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">CLIENT LAYER</text>
    <text x="16" y="126" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Next.js 15 UI Client</text>
    <text x="16" y="146" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Ethers.js / Viem Provider</text>
    <text x="16" y="166" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· EIP-712 Typed Signatures</text>
    <text x="16" y="186" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Multi-Wallet Connection</text>
    
    <rect x="16" y="206" width="168" height="20" rx="4" fill="#273742" />
    <text x="24" y="220" fill="#E8DAB2" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Non-Custodial Authorization</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M240 270 L300 270" stroke="#DD6E42" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="300,266 308,270 300,274" fill="#DD6E42" />

  <!-- Node 2: Core On-Chain Contracts (Center) -->
  <g transform="translate(310, 130)">
    <rect width="360" height="280" rx="12" fill="#1C2B36" stroke="#627EEA" stroke-width="1.5" />
    
    <!-- Title Area -->
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#26354A" />
    <!-- Ethereum diamond icon -->
    <path d="M36 22 L45 36 L36 41 L27 36 Z" stroke="#627EEA" stroke-width="1.5" fill="none" />
    <path d="M36 41 L45 36 L36 49 L27 36 Z" stroke="#627EEA" stroke-width="1.5" fill="none" />

    <text x="68" y="36" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">EVM Smart Contract Suite</text>
    <text x="68" y="52" fill="#627EEA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ON-CHAIN SOLIDITY ARCHITECTURE</text>

    <!-- Sub-Contract 1: ERC-20 Token Vault -->
    <g transform="translate(16, 70)">
      <rect width="328" height="52" rx="8" fill="#17222A" stroke="#364E5C" stroke-width="1" />
      <circle cx="24" cy="26" r="6" fill="#FFB703" />
      <text x="38" y="24" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">ERC-20 &amp; Stablecoin Vault</text>
      <text x="38" y="38" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Multi-asset deposit locking, gas-efficient balance mapping</text>
    </g>

    <!-- Sub-Contract 2: Escrow Engine -->
    <g transform="translate(16, 132)">
      <rect width="328" height="60" rx="8" fill="#17222A" stroke="#DD6E42" stroke-width="1" />
      <circle cx="24" cy="30" r="6" fill="#DD6E42" />
      <text x="38" y="24" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Programmable Escrow Logic</text>
      <text x="38" y="38" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Condition checks, multi-sig approval, timelock expirations</text>
      <text x="38" y="50" fill="#FFB703" font-family="system-ui, -apple-system, sans-serif" font-size="9">ReentrancyGuard · Pausable · SafeERC20</text>
    </g>

    <!-- Sub-Contract 3: Fee & Dispute Resolver -->
    <g transform="translate(16, 202)">
      <rect width="328" height="52" rx="8" fill="#17222A" stroke="#364E5C" stroke-width="1" />
      <circle cx="24" cy="26" r="6" fill="#34D399" />
      <text x="38" y="24" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Fee Distribution &amp; Settlement</text>
      <text x="38" y="38" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Automated platform splits, dispute arbitration release</text>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M670 270 L730 270" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="730,266 738,270 730,274" fill="#34D399" />

  <!-- Node 3: On-Chain Event & Settlement (Right) -->
  <g transform="translate(740, 150)">
    <rect width="220" height="240" rx="12" fill="#1A262F" stroke="#364E5C" stroke-width="1.5" />
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#243540" />
    <!-- Blocks & Check icon -->
    <path d="M24 38 L30 42 L42 28" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="16" y="80" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Settlement &amp; Events</text>
    <text x="16" y="100" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">STATE RESOLUTION</text>
    <text x="16" y="126" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Indexed Event Emissions</text>
    <text x="16" y="146" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Automated Ledger Sync</text>
    <text x="16" y="166" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Instant Beneficiary Payout</text>
    <text x="16" y="186" fill="#C0D6DF" font-family="system-ui, -apple-system, sans-serif" font-size="11">· Zero Reversible Errors</text>
    
    <rect x="16" y="206" width="188" height="20" rx="4" fill="#273742" />
    <text x="24" y="220" fill="#E8DAB2" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Verifiable On-Chain Finality</text>
  </g>

  <!-- Bottom Architecture Metrics Footer -->
  <g transform="translate(40, 440)">
    <rect width="920" height="75" rx="10" fill="#141E25" stroke="#243540" stroke-width="1" />
    <g transform="translate(30, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">SUPPORTED CHAINS</text>
      <text x="0" y="38" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Ethereum · Polygon · BNB Chain</text>
    </g>
    <line x1="280" y1="15" x2="280" y2="60" stroke="#243540" stroke-width="1" />
    <g transform="translate(310, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">SECURITY STANDARDS</text>
      <text x="0" y="38" fill="#FFB703" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">OpenZeppelin Contracts v5</text>
    </g>
    <line x1="560" y1="15" x2="560" y2="60" stroke="#243540" stroke-width="1" />
    <g transform="translate(590, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">SETTLEMENT TIME</text>
      <text x="0" y="38" fill="#F2F5F7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Sub-Minute Block Finality</text>
    </g>
    <line x1="790" y1="15" x2="790" y2="60" stroke="#243540" stroke-width="1" />
    <g transform="translate(815, 20)">
      <text x="0" y="16" fill="#8198A4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">TEST COVERAGE</text>
      <text x="0" y="38" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">100% Core Logic Tested</text>
    </g>
  </g>
</svg>
